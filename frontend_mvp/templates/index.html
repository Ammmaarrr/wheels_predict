<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakWheels Car Price Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 1.1em;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #e8f5e8, #f0f8ff);
            border-radius: 15px;
            border-left: 5px solid #28a745;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .price {
            font-size: 2.5em;
            font-weight: bold;
            color: #28a745;
            text-align: center;
            margin-bottom: 10px;
        }

        .confidence {
            text-align: center;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: linear-gradient(135deg, #ffe8e8, #fff0f0);
            border-left-color: #dc3545;
            color: #721c24;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .info-box {
            background: linear-gradient(135deg, #fff3cd, #ffeaa7);
            border: 1px solid #ffeeba;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            color: #856404;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 PakWheels Price Predictor</h1>
        
        <div class="info-box">
            <strong>💡 Quick Tip:</strong> Enter your car details below to get an instant price prediction powered by AI analysis of thousands of PakWheels listings!
        </div>

        <form id="predictionForm">
            <div class="form-group">
                <label for="brand">Car Brand *</label>
                <select id="brand" name="brand" required>
                    <option value="">Select Brand</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Honda">Honda</option>
                    <option value="Suzuki">Suzuki</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Kia">Kia</option>
                    <option value="Nissan">Nissan</option>
                    <option value="BMW">BMW</option>
                    <option value="Mercedes">Mercedes</option>
                    <option value="Audi">Audi</option>
                    <option value="Volkswagen">Volkswagen</option>
                    <option value="Mitsubishi">Mitsubishi</option>
                    <option value="Daihatsu">Daihatsu</option>
                    <option value="Changan">Changan</option>
                    <option value="MG">MG</option>
                    <option value="Haval">Haval</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" name="model" placeholder="e.g., Corolla, Civic, Alto">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="year">Year *</label>
                    <select id="year" name="year" required>
                        <option value="">Select Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="engine_capacity">Engine (L)</label>
                    <select id="engine_capacity" name="engine_capacity">
                        <option value="">Select Engine</option>
                        <option value="0.66">660cc</option>
                        <option value="0.8">800cc</option>
                        <option value="1.0">1000cc</option>
                        <option value="1.3">1300cc</option>
                        <option value="1.5">1500cc</option>
                        <option value="1.6">1600cc</option>
                        <option value="1.8">1800cc</option>
                        <option value="2.0">2000cc</option>
                        <option value="2.4">2400cc</option>
                        <option value="3.0">3000cc</option>
                        <option value="3.5">3500cc</option>
                        <option value="4.0">4000cc</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mileage">Mileage (km)</label>
                    <input type="number" id="mileage" name="mileage" placeholder="e.g., 50000" min="0" max="500000">
                </div>

                <div class="form-group">
                    <label for="transmission">Transmission</label>
                    <select id="transmission" name="transmission">
                        <option value="">Select Transmission</option>
                        <option value="manual">Manual</option>
                        <option value="automatic">Automatic</option>
                        <option value="cvt">CVT</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn" id="predictBtn">
                🔮 Get Price Prediction
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing your car data...</p>
        </div>

        <div class="result" id="result">
            <div class="price" id="predictedPrice">Rs. 0</div>
            <div class="confidence" id="confidence">Confidence: 0%</div>
        </div>
    </div>

    <script>
        // Populate year dropdown
        const yearSelect = document.getElementById('year');
        const currentYear = new Date().getFullYear();
        for (let year = currentYear; year >= 1990; year--) {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year;
            yearSelect.appendChild(option);
        }

        // Form submission
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {};
            
            // Collect form data
            for (let [key, value] of formData.entries()) {
                if (value.trim() !== '') {
                    // Convert numeric fields
                    if (['year', 'mileage', 'engine_capacity'].includes(key)) {
                        data[key] = parseFloat(value);
                    } else {
                        data[key] = value;
                    }
                }
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').classList.remove('show');
            document.getElementById('predictBtn').disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const result = await response.json();
                
                // Display results
                document.getElementById('predictedPrice').textContent = 
                    `Rs. ${result.predicted_price.toLocaleString()}`;
                document.getElementById('confidence').textContent = 
                    `Confidence: ${(result.confidence * 100).toFixed(1)}%`;
                
                document.getElementById('result').classList.remove('error');
                document.getElementById('result').classList.add('show');

            } catch (error) {
                // Display error
                document.getElementById('predictedPrice').textContent = 'Prediction Failed';
                document.getElementById('confidence').textContent = 
                    `Error: ${error.message}`;
                
                document.getElementById('result').classList.add('error');
                document.getElementById('result').classList.add('show');
            } finally {
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('predictBtn').disabled = false;
            }
        });

        // Form enhancements
        document.getElementById('brand').addEventListener('change', function() {
            const model = document.getElementById('model');
            if (this.value === 'Toyota') {
                model.placeholder = 'e.g., Corolla, Camry, Prius, Vitz';
            } else if (this.value === 'Honda') {
                model.placeholder = 'e.g., Civic, City, Accord, Fit';
            } else if (this.value === 'Suzuki') {
                model.placeholder = 'e.g., Alto, Cultus, Swift, Jimny';
            } else {
                model.placeholder = 'Enter model name';
            }
        });
    </script>
</body>
</html>
