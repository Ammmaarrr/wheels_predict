name: Scheduled Data Scraping

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  PYTHON_VERSION: '3.13'

jobs:
  scrape-data:
    name: Scrape PakWheels Data
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements.txt

    - name: Set up environment
      run: |
        cp .env.example .env
        echo "LOG_LEVEL=INFO" >> .env

    - name: Create data directories
      run: |
        mkdir -p data/raw data/cleaned logs

    - name: Run scraping
      run: |
        cd scrapers
        python run_scrapy_weekly.py
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Process scraped data
      run: |
        python data_processing/clean_and_preprocess.py
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Upload scraped data
      uses: actions/upload-artifact@v3
      with:
        name: scraped-data-${{ github.run_number }}
        path: |
          data/raw/
          data/cleaned/
        retention-days: 30

    - name: Update models if needed
      run: |
        python models/train_and_tune_models.py
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --staged --quiet || git commit -m "Automated data update $(date '+%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-scraping:
    name: Notify Scraping Results
    runs-on: ubuntu-latest
    needs: scrape-data
    if: always()

    steps:
    - name: Notify success
      if: needs.scrape-data.result == 'success'
      run: |
        echo "Data scraping completed successfully"
        # Add notification logic here

    - name: Notify failure
      if: needs.scrape-data.result == 'failure'
      run: |
        echo "Data scraping failed"
        # Add notification logic here
